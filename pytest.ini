[pytest]
testpaths = tests
# basetemp 放到 work/ 下（已 gitignore），避免在仓库根目录生成 GB 级 pytest-of-* 临时目录；
# slow 用例（真实 6 文件 ASR 边界等）默认不跑，验收时用 `pytest -m slow` 显式运行。
addopts = -q --basetemp=work/pytest_tmp -m "not slow"
markers =
    data: 依赖 data/ 下真实样例文件（缺失时自动 skip）
    slow: 长时间集成测试（pytest -m slow 显式运行）
filterwarnings =
    ignore::DeprecationWarning
