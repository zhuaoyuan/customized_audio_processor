# 人工抽听后的逐文件边界修正（P2-T3 人工确认，机器边界之上的 override）
#
# 用途：头尾边界由算法自动判定，人工抽听后若需要调整，**写在这里**而不是改代码——
#       analyze 阶段会读取本文件并在自动边界上做覆盖，且改动会自动让分析缓存失效。
#
# 匹配规则（见 app/pipeline/analyze.py:_match_review）：
#   - key 可以是 **job id 全名**，也可以是 **job id 的 8 位 hash 前缀**（scan 输出里 id 的第一段）；
#   - 也支持 `yaml` 列表写法：reviews: [{job_id: ..., head_s: ..., tail_s: ...}]。
#
# 字段：
#   head_s / tail_s : 覆盖后的边界绝对时间（秒）。tail_s 是「讲课结束时刻」，不是裁剪量。
#   note            : 决策依据（会写进 stages.analyze 的 metrics 与日志，便于审计）。
#
# 2026-10-21 抽听结论（out/review/，9 段）：
#   01 f24 4470–4560 保留（讲课前交代，非课程内容但保留）
#   02 f24 4560–4620 裁（课件/课后讨论、嘈杂议论+学生上台提问）
#   03 f24 4620–4673 裁（同上）
#   04 f06 0–120     裁（无信息量的考前闲聊/音乐）
#   05 f06 120–180   保留（正常讲课）
#   06 f20 0–90      裁（只有杂音，无内容）
#   07 f20 90–150    保留（上课内容；伴随杂音需在 P3 降噪里重点处理）
#   08 f00 2970–3047 **裁**（声音很轻、含少量主讲，但属课后收设备声；f00 归一化 +21.5 dB，
#                      保留会把该噪声一起放大 → 裁，理由见下 note）
#   09 f04 8240–8295 保留（片尾仍在讲课）

version: 1
reviewed_at: "2026-10-21"
reviews:
  "621cb91c":  # f00_xifang20140227 · data/0_20140227-丁耘 西方哲学(...)_normal..m4a
    # 自动边界 tail=3047.2（=文件结束，即不裁）；人工要求裁掉最后 46.7 s
    tail_s: 3000.5
    note: "抽听：片尾为课后收起录音设备的声音（音量很轻、含少量主讲人声）；f00 源 ASL −39 dB、归一化需 +21.5 dB，保留会把该噪声放大成明显底噪，故裁。"
