# audio_processer 默认配置
# ---------------------------------------------------------------------------
# 说明：
#   - 这里的值是「已锁定技术决策」（见 docs/实施计划.md §2），不要随意改动；
#   - 相对路径均相对项目根目录解析；
#   - 支持 ${paths.xxx} 形式的占位符（只在 paths 段内解析）；
#   - 环境变量覆盖：DEEPSEEK_API_KEY、MODEL_DIR、AP_PRESET、AP_OUT_DIR；
#   - 命令行 --preset fast|standard|quality 会叠加 configs/presets/<preset>.yaml。

project:
  name: audio_processer
  version: "0.1.0"

# ---------------------------------------------------------------- 路径
paths:
  data_dir: data
  out_dir: out
  work_dir: work
  cache_dir: work/cache            # 解码/渲染中间 wav（阶段结束清理）
  quarantine_dir: out/quarantine   # 修不好的输入隔离区
  logs_dir: out/logs
  db_path: out/jobs.db             # SQLite（jobs/stages）
  models_root: work/bench/models   # MODEL_DIR 环境变量可覆盖
  models:
    sensevoice_dir: ${paths.models_root}/sensevoice
    whisper_cache: ${paths.models_root}/whisper
    rnnoise_model: ${paths.models_root}/rnnoise/sh.rnnn
    diar_dir: work/diar/models
    silero_vad: ""                 # 空 = 用 faster_whisper 包内自带 assets

# ---------------------------------------------------------------- 日志
logging:
  level: INFO                      # DEBUG|INFO|WARNING|ERROR
  console: true                    # 同时输出到 stdout
  file_name: run.log
  rotate_mb: 10
  rotate_backups: 5

# ---------------------------------------------------------------- 扫描
scan:
  extensions: [.m4a, .mp3, .wav, .mp4, .flac, .aac, .wma, .ogg, .opus, .webm]
  recursive: true
  min_bytes: 65536                 # 小于此值视为占位/损坏文件
  max_bytes: 0                     # 0 = 不限

# ---------------------------------------------------------------- 解码
decode:
  analysis_sr: 16000               # 分析（VAD/ASR/电平）采样率
  render_sr: 44100                 # 渲染输出采样率
  channels: 1
  sample_fmt: pcm_f32le            # 必须 float32：源有 >0 dBFS 过冲，先削顶会丢失判断
  timeout_s: 1800
  duration_tolerance_s: 5.0        # 解码时长与 ffprobe 时长的允许偏差
  min_duration_ratio: 0.9          # 解码时长 / ffprobe 时长 低于此值视为解码异常
  repair:
    enabled: true                  # MP4 stco 偏移损坏自动修复后重试
    keep_fixed_file: false         # 修复副本用后即删（避免 300 文件磁盘膨胀）
  cache:
    enabled: true                  # work/cache/<id>.16k.wav 可复用
    cleanup_on_stage_end: true

# ---------------------------------------------------------------- VAD
vad:
  engine: silero-v6
  threshold: 0.5
  min_speech_s: 0.25
  min_silence_s: 0.30
  pad_s: 0.10

# ---------------------------------------------------------------- 电平统计
levels:
  target_asl_dbfs: -20.0           # 锁定值
  rel_db: 15.0                     # P.56 式 ASL 的相对门限
  min_continuous_speech_s: 3.0     # 只统计 ≥3 s 连续语音段
  window_s: 300.0                  # 5 min 窗口
  cross_file_tolerance_db: 0.5
  window_half_spread_tolerance_db: 1.5

# ---------------------------------------------------------------- 裁剪
trim:
  head_tail_scan_s: 900.0          # 头/尾各最多扫 15 min
  head_tail_scan_extended_s: 1800.0 # 未找到则扩到 30 min
  boundary_window_s: 120.0         # 120 s 窗口聚合 ASR 字符率
  boundary_min_chars_per_sec: 2.0  # 讲课窗口判据
  boundary_consecutive_windows: 2  # 连续 2 窗口判讲课起点
  boundary_pad_s: 0.5              # 边界两侧留余量
  internal_silence_min_s: 3.0      # 内部非语音 ≥3 s 切除
  internal_guard_s: 0.25           # 切除两侧保护带
  keep_fragments: true             # <3 s 碎片语音保留

# ---------------------------------------------------------------- 降噪
denoise:
  mode: afftdn                     # afftdn | arnndn | highpass | off
  highpass_hz: 80
  afftdn:
    nr: 12.0
    nf: -30.0
    tn: 1
  arnndn:
    model: sh.rnnn                 # 相对模型目录（Windows 盘符冒号会破坏 filter 解析）
    resample_sr: 48000             # rnnoise 只支持 48k，须 aresample 进出
  low_snr_db: 12.0                 # SNR 低于此值时提示可升 nr/切 arnndn

# ---------------------------------------------------------------- 响度
loudness:
  target_asl_dbfs: -20.0           # 锁定值（与 levels.target_asl_dbfs 一致）
  gain_min_db: -24.0
  gain_max_db: 24.0
  v2:
    enabled: true                  # 默认启用：静态增益 + 受控慢变
    win_s: 20.0
    hop_s: 5.0
    clamp_db: 3.0
    high_drift_clamp_db: 6.0       # 源内波动 > drift_threshold_db 时放宽
    drift_threshold_db: 6.0
    max_rate_db_s: 1.5
    crossfade_ms: 20
  v3: "off"                        # 按说话人增益：默认关闭
  limiter:
    target_tp_dbtp: -1.0           # 真峰值硬指标
    ceiling_dbfs: -2.75            # 初始 ceiling（4x 过采样测真峰值后回读下调）
    oversample: 4
    max_iterations: 3

# ---------------------------------------------------------------- 转写
asr:
  engine: sensevoice
  model: int8                      # int8 | fp32
  num_threads: 8
  use_itn: true
  language: auto
  segment_min_s: 0.5
  segment_max_s: 30.0
  empty_ratio_max: 0.05

# ---------------------------------------------------------------- 说话人
diar:
  mode: none                       # none | sampled | full
  sample_minutes: 10
  sample_segments: 3
  threshold: 0.7
  min_speaker_s: 5.0
  min_speaker_ratio: 0.03

# ---------------------------------------------------------------- 纠错
correct:
  enabled: true
  base_url: https://api.deepseek.com/v1
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  api_key: ""                      # 只由环境变量注入，不写进文件
  prompt_file: configs/prompts/correct_system.txt
  hotwords_dir: configs/hotwords
  chunk_min_chars: 2000
  chunk_max_chars: 2500
  max_diff_ratio: 0.12
  max_sentence_change_ratio: 0.05
  timeout_s: 120
  max_retries: 3
  concurrency: 8

# ---------------------------------------------------------------- 无关人声
unrelated_speech:
  mode: conservative               # conservative | off | aggressive
  max_chars_per_sec: 0.5
  min_duration_s: 5.0
  keep_fragments: true

# ---------------------------------------------------------------- 输出
output:
  audio_codec: aac
  audio_bitrate: 96k
  audio_channels: 1
  formats: [json, md, srt, txt]

# ---------------------------------------------------------------- 批处理
batch:
  jobs: 1                          # 实测进程池更慢，默认单进程
  resume: true
  max_attempts: 2
  disk_free_min_gb: 10.0
